steps:
  - id: 'Check if Dockerfile.gemini modified'
    name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -f .git/shallow ]; then
          echo "Shallow clone detected. Fetching parent commit for branch $${BRANCH_NAME}..."
          git fetch origin "$${BRANCH_NAME}" --depth=2 || echo "Fetch failed."
        fi
        
        CURR_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        PREV_COMMIT=$(git rev-parse --short HEAD^ 2>/dev/null || echo "none")
        echo "Comparing commit $$CURR_COMMIT with parent $$PREV_COMMIT"
        
        if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q "cicd/gemini_based_cicd/Dockerfile.gemini"; then
          echo "-> cicd/gemini_based_cicd/Dockerfile.gemini was modified. Setting BUILD_GEMINI=true"
          echo "true" > /workspace/BUILD_GEMINI
        elif git diff --name-only HEAD^ HEAD >/dev/null 2>&1; then
          echo "-> cicd/gemini_based_cicd/Dockerfile.gemini was not modified. Setting BUILD_GEMINI=false"
          echo "false" > /workspace/BUILD_GEMINI
        else
          echo "-> Warning: git diff failed. Defaulting to BUILD_GEMINI=true to be safe."
          echo "true" > /workspace/BUILD_GEMINI
        fi
    env:
      - BRANCH_NAME=${BRANCH_NAME}
  - id: 'Build Gemini CLI with Docker'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BUILD_REQUIRED=$(cat /workspace/BUILD_GEMINI || echo "true")
        REGISTRY="${_IMAGE_CACHE_REGISTRY}"
        
        HAD_IMAGE=false
        if [ -n "$$REGISTRY" ]; then
          echo "Attempting to pull image from cache: $$REGISTRY"
          docker pull "$$REGISTRY" || echo "Image not found in cache."
          
          if docker image inspect "$$REGISTRY" >/dev/null 2>&1; then
            echo "Found image in cache."
            docker tag "$$REGISTRY" gemini-cli-with-docker
            HAD_IMAGE=true
          fi
        fi
        
        echo "Decision Factors:"
        echo "-> BUILD_REQUIRED: $$BUILD_REQUIRED"
        echo "-> HAD_IMAGE:      $$HAD_IMAGE"
        
        if [ "$$BUILD_REQUIRED" = "true" ] || [ "$$HAD_IMAGE" = "false" ]; then
          if [ "$$BUILD_REQUIRED" = "true" ]; then
            echo "-> Reason: build was forced (BUILD_REQUIRED=true)"
          else
            echo "-> Reason: no cached image available (HAD_IMAGE=false)"
          fi
          echo "Building Gemini CLI image..."
          docker build -t gemini-cli-with-docker -f cicd/gemini_based_cicd/Dockerfile.gemini .
          if [ -n "$$REGISTRY" ]; then
            echo "Pushing new image back to cache..."
            docker tag gemini-cli-with-docker "$$REGISTRY"
            docker push "$$REGISTRY"
          fi
        else
          echo "Skipping build. Using cached image."
        fi
        rm /workspace/BUILD_GEMINI
  - id : 'Run Gemini CLI for local tests'
    name: 'gemini-cli-with-docker'
    entrypoint: 'bash'
    args: 
      - '-c'
      - |
        #!/usr/bin/env bash
        
        # Enable exit-on-error mode
        set -eo pipefail
        
        gemini --yolo --prompt "/skills list"
        gemini --yolo --prompt "Optimize the Airflow DAGs and run local tests"
        # gemini --yolo --prompt "Run local tests using the cicd/gemini_based_cicd/.agents/skills/local-airflow-unit-tests/SKILL.md skill"
    env:
      - 'GOOGLE_GENAI_USE_VERTEXAI=true'
      - 'GOOGLE_CLOUD_PROJECT=${_MODEL_PROJECT_ID}'
      - 'GOOGLE_CLOUD_LOCATION=${_MODEL_LOCATION}'
      - 'MODEL_ID=${_MODEL_ID}'
      - 'GEMINI_CLI_TRUST_WORKSPACE=true'
  - id: 'Commit and push changes'
    name: 'gemini-cli-with-docker'
    entrypoint: 'bash'
    secretEnv: ['GITHUB_TOKEN']
    args:
      - '-c'
      - |
        if [[ -n $$(git status -s) ]]; then
          echo "Changes detected. Creating a feature branch..."
          git config --global user.email "${SERVICE_ACCOUNT_EMAIL}"
          git config --global user.name "Cloud Build"
          
          export GH_TOKEN=$$GITHUB_TOKEN
          gh auth setup-git

          GEMINI_FIX_BRANCH_NAME="gemini-fix-${BUILD_ID}"
          git checkout -b "$$GEMINI_FIX_BRANCH_NAME"
          
          git add --update
          git commit -m "Automated updates from Gemini CLI"
          git push origin "$$GEMINI_FIX_BRANCH_NAME"
          
          echo "Creating pull request on GitHub..."
          gh pr create \
            --title "Automated updates from Gemini CLI" \
            --body "This PR was automatically generated by the Gemini CLI pipeline." \
            --head "$$GEMINI_FIX_BRANCH_NAME" \
            --base "$$BRANCH_NAME"
        else
          echo "No changes detected."
        fi
    env:
      - BRANCH_NAME=${BRANCH_NAME}

substitutions:
  _IMAGE_CACHE_REGISTRY: 'us-docker.pkg.dev/${PROJECT_ID}/custom-gemini-cli-builds/gemini-cli-with-docker:latest'
  # _MODEL_ID: 'gemini-3-flash-preview'
  _MODEL_ID: 'gemini-3.1-pro-preview'
  _MODEL_PROJECT_ID: ${PROJECT_ID}
  _MODEL_LOCATION: 'global'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  dynamicSubstitutions: true

timeout: 14400s # 4 hours

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/composer-utilities-github-token/versions/latest
      env: 'GITHUB_TOKEN'
